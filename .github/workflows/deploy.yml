name: Universal Deploy

on:
  push:
    branches:
      - main
      - develop
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - prod
      action:
        description: 'Action to perform'
        required: true
        default: 'deploy'
        type: choice
        options:
          - deploy
          - rollback

env:
  PROJECT_NAME: ${{ github.event.repository.name }}
  DOCKER_COMPOSE_VERSION: '2.23.0'

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    environment: ${{ github.event.inputs.environment == 'prod' && 'production' || (github.ref == 'refs/heads/main' && 'production') || 'development' }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      with:
        fetch-depth: 0
    
    - name: Setup SSH agent for DEV
      uses: webfactory/ssh-agent@v0.8.0
      with:
        ssh-private-key: ${{ secrets.DEV_SSH_KEY }}
    
    - name: Setup SSH agent for PROD
      if: github.event.inputs.environment == 'prod' || github.ref == 'refs/heads/main'
      uses: webfactory/ssh-agent@v0.8.0
      with:
        ssh-private-key: ${{ secrets.PROD_SSH_KEY }}
    
    - name: Set deployment variables
      id: vars
      run: |
        # Определяем окружение
        if [[ "${{ github.event.inputs.environment }}" == "prod" ]] || [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
          ENVIRONMENT="prod"
          SERVER_HOST="${{ vars.PROD_SERVER_HOST }}"
          SERVER_USER="${{ vars.PROD_SERVER_USER }}"
          SERVER_PORT="${{ vars.PROD_SERVER_PORT }}"
          PROJECT_DIR="${{ vars.PROD_PROJECT_DIR }}"
          # Используем переменную, если она есть, иначе значение по умолчанию
          if [ -n "${{ vars.PROD_NETWORK_NAME }}" ]; then
            NETWORK_NAME="${{ vars.PROD_NETWORK_NAME }}"
          else
            NETWORK_NAME="app-network"
          fi
        else
          ENVIRONMENT="dev"
          SERVER_HOST="${{ vars.DEV_SERVER_HOST }}"
          SERVER_USER="${{ vars.DEV_SERVER_USER }}"
          SERVER_PORT="${{ vars.DEV_SERVER_PORT }}"
          PROJECT_DIR="${{ vars.DEV_PROJECT_DIR }}"
          if [ -n "${{ vars.DEV_NETWORK_NAME }}" ]; then
            NETWORK_NAME="${{ vars.DEV_NETWORK_NAME }}"
          else
            NETWORK_NAME="app-network"
          fi
        fi
        
        # Проверяем обязательные переменные
        if [ -z "$SERVER_HOST" ]; then
          echo "❌ Error: SERVER_HOST is empty for $ENVIRONMENT environment"
          exit 1
        fi
        
        if [ -z "$SERVER_USER" ]; then
          echo "❌ Error: SERVER_USER is empty for $ENVIRONMENT environment"
          exit 1
        fi
        
        # Устанавливаем значения по умолчанию
        if [ -z "$SERVER_PORT" ]; then
          SERVER_PORT="22"
        fi
        
        if [ -z "$PROJECT_DIR" ]; then
          if [ "$ENVIRONMENT" == "prod" ]; then
            PROJECT_DIR="/home/oz-admin/csh/frontend"
          else
            PROJECT_DIR="/home/oz-admin/csh/frontend"
          fi
        fi
        
        # Сохраняем в output
        echo "environment=$ENVIRONMENT" >> $GITHUB_OUTPUT
        echo "server_host=$SERVER_HOST" >> $GITHUB_OUTPUT
        echo "server_user=$SERVER_USER" >> $GITHUB_OUTPUT
        echo "server_port=$SERVER_PORT" >> $GITHUB_OUTPUT
        echo "project_dir=$PROJECT_DIR" >> $GITHUB_OUTPUT
        echo "network_name=$NETWORK_NAME" >> $GITHUB_OUTPUT
        
        # Debug info
        echo "=== Deployment Configuration ==="
        echo "Environment: $ENVIRONMENT"
        echo "Server: $SERVER_USER@$SERVER_HOST:$SERVER_PORT"
        echo "Project directory: $PROJECT_DIR"
        echo "Network name: $NETWORK_NAME"
        echo "================================"
    
    - name: Prepare deployment package
      run: |
        # Создаем временную директорию для сборки
        mkdir -p deploy-package
        
        echo "📦 Copying project files..."
        
        # Копируем все необходимые файлы
        if [ -f "docker-compose.dev.yml" ]; then
          cp docker-compose.dev.yml deploy-package/
          echo "✅ Copied docker-compose.dev.yml"
        fi
        
        if [ -f "docker-compose.yml" ]; then
          cp docker-compose.yml deploy-package/
          echo "✅ Copied docker-compose.yml"
        fi

        if [ -f "deploy.sh" ]; then
          cp deploy.sh deploy-package/
          echo "✅ Copied deploy.sh"
        fi
        
        if [ -f ".env.example" ]; then
          cp .env.example deploy-package/
          echo "✅ Copied .env.example"
        fi
        
        if [ -d "DbBackups" ]; then
          cp -r DbBackups deploy-package/
          echo "✅ Copied DbBackups directory"
        fi

        if [ -d "Deploy" ]; then
          cp -r Deploy deploy-package/
          echo "✅ Copied Deploy directory"
        fi

        if [ -d "KnowledgeApp" ]; then
          cp -r KnowledgeApp deploy-package/
          echo "✅ Copied KnowledgeApp directory"
        fi
        
        # Создаем .env файл с переменными
        cat > deploy-package/.env << EOF
          # Generated on $(date)
          PROJECT_NAME=${{ env.PROJECT_NAME }}
          ENVIRONMENT=${{ steps.vars.outputs.environment }}
          NODE_ENV=${{ steps.vars.outputs.environment }}
          NETWORK_NAME=${{ steps.vars.outputs.network_name }}
        EOF
        
        echo "✅ Created .env file"
        
        # Создаем архив
        cd deploy-package
        tar -czf ../deploy.tar.gz .
        cd ..
        
        echo "✅ Deployment package created: deploy.tar.gz"
        echo "Archive size: $(du -h deploy.tar.gz | cut -f1)"
        
        # Показываем содержимое пакета
        echo "📦 Package contents:"
        tar -tzf deploy.tar.gz | head -20
    
    - name: Deploy to server
      run: |
        SERVER_HOST="${{ steps.vars.outputs.server_host }}"
        SERVER_USER="${{ steps.vars.outputs.server_user }}"
        SERVER_PORT="${{ steps.vars.outputs.server_port }}"
        PROJECT_DIR="${{ steps.vars.outputs.project_dir }}"
        NETWORK_NAME="${{ steps.vars.outputs.network_name }}"
        
        echo "📦 Copying deployment package to $SERVER_USER@$SERVER_HOST..."
        
        # Создаем временный файл для проверки
        scp -P $SERVER_PORT \
          -o StrictHostKeyChecking=no \
          -o UserKnownHostsFile=/dev/null \
          -o ConnectTimeout=30 \
          deploy.tar.gz \
          $SERVER_USER@$SERVER_HOST:/tmp/deploy.tar.gz
        
        if [ $? -ne 0 ]; then
          echo "❌ Failed to copy deployment package"
          exit 1
        fi
        
        echo "✅ Package copied successfully"
        echo "🚀 Executing deployment script on remote server..."
        
        ssh -p $SERVER_PORT \
          -o StrictHostKeyChecking=no \
          -o UserKnownHostsFile=/dev/null \
          -o ConnectTimeout=30 \
          $SERVER_USER@$SERVER_HOST << 'REMOTE_SCRIPT'
          set -e
          
          PROJECT_DIR="${{ steps.vars.outputs.project_dir }}"
          NETWORK_NAME="${{ steps.vars.outputs.network_name }}"
          
          echo "[INFO] Preparing project directory: $PROJECT_DIR"
          echo "[INFO] Network name: $NETWORK_NAME"
          
          # Создаем директорию
          mkdir -p $PROJECT_DIR
          
          # Проверяем права
          if [ ! -w "$PROJECT_DIR" ]; then
            echo "[ERROR] Cannot write to $PROJECT_DIR"
            echo "Current user: $(whoami)"
            echo "Directory owner: $(stat -c '%U' $PROJECT_DIR 2>/dev/null || echo 'unknown')"
            echo "Directory permissions: $(stat -c '%a' $PROJECT_DIR 2>/dev/null || echo 'unknown')"
            exit 1
          fi
          
          # Очищаем директорию (сохраняем .env если он есть)
          echo "[INFO] Cleaning project directory..."
          if [ -f "$PROJECT_DIR/.env" ]; then
            cp $PROJECT_DIR/.env /tmp/.env.backup
            echo "[INFO] Backed up .env file"
          fi
          
          rm -rf $PROJECT_DIR/*
          
          # Распаковываем
          echo "[INFO] Extracting deployment package..."
          tar -xzf /tmp/deploy.tar.gz -C $PROJECT_DIR
          
          # Восстанавливаем .env если был
          if [ -f "/tmp/.env.backup" ]; then
            cp /tmp/.env.backup $PROJECT_DIR/.env
            echo "[INFO] Restored .env file"
            rm -f /tmp/.env.backup
          fi
          
          cd $PROJECT_DIR
          
          echo "[INFO] Current directory: $(pwd)"
          echo "[INFO] Directory structure:"
          ls -la
          
          # Убеждаемся, что deploy.sh существует и исполняемый
          if [ ! -f "deploy.sh" ]; then
            echo "[ERROR] deploy.sh not found in deployment package!"
            echo "Available files:"
            ls -la
            exit 1
          fi
          
          # Экспортируем переменную для скрипта
          export NETWORK_NAME="$NETWORK_NAME"
          export CLEAN_IMAGES="false"
          export WAIT_TIME="15"
          
          # Запускаем деплой
          chmod +x deploy.sh
          ./deploy.sh
          
          # Очистка
          rm -f /tmp/deploy.tar.gz
          
        REMOTE_SCRIPT
        
        if [ $? -ne 0 ]; then
          echo "❌ Deployment failed"
          exit 1
        fi
        
        echo "✅ Deployment script executed successfully"
    
    - name: Health check
      run: |
        echo "🔍 Running health check..."
        sleep 20
        
        SERVER_HOST="${{ steps.vars.outputs.server_host }}"
        SERVER_PORT="${{ steps.vars.outputs.server_port }}"
        SERVER_USER="${{ steps.vars.outputs.server_user }}"
        
        # Проверка через curl
        if curl -f -s -o /dev/null -w "%{http_code}" http://$SERVER_HOST | grep -q "200\|301\|302\|401"; then
          echo "✅ Health check passed (HTTP)"
        else
          echo "⚠️ Health check failed, but deployment completed"
        fi
        
        # Дополнительная проверка через SSH
        echo "📊 Container status:"
        ssh -p $SERVER_PORT \
          -o StrictHostKeyChecking=no \
          $SERVER_USER@$SERVER_HOST \
          "cd ${{ steps.vars.outputs.project_dir }} && docker-compose -f docker-compose.dev.yml ps 2>/dev/null || echo 'No containers running'"
        
        echo "🌐 Network status:"
        ssh -p $SERVER_PORT \
          -o StrictHostKeyChecking=no \
          $SERVER_USER@$SERVER_HOST \
          "docker network inspect ${{ steps.vars.outputs.network_name }} 2>/dev/null | grep -A 5 'Containers' | head -10 || echo 'Network not found'"
    
    - name: Send notification
      if: always()
      run: |
        if [ "${{ job.status }}" == "success" ]; then
          echo "✅ Deployment SUCCESS"
          echo "🎉 Application deployed successfully to ${{ steps.vars.outputs.environment }} environment"
        else
          echo "❌ Deployment FAILED"
          echo "💥 Failed to deploy to ${{ steps.vars.outputs.environment }} environment"
        fi
        echo "Environment: ${{ steps.vars.outputs.environment }}"
        echo "Project: ${{ env.PROJECT_NAME }}"
        echo "Network: ${{ steps.vars.outputs.network_name }}"
        echo "Server: ${{ steps.vars.outputs.server_host }}"
        echo "Time: $(date)"